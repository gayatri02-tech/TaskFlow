<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
<link rel="stylesheet" href="taskflow.css">
</head>
<body>
   
    <!-- heading -->
    
     <h1>TASKFLOW</h1>
    <p>Smart Task Manager</p>

    <!-- Add task -->
    
    <div class="container">
        
            <input type="text" placeholder="What do you need to do?" id="input">
        
         <div class="select-group">
            <label>Priority</label> <br>
            <select  id="Priority">
                <option value="High">🔴 High</option>
                <option value="Medium">🟠 Medium</option>
                <option value="Low">🟢 Low</option>
            </select>
         </div>

        <div class="select-group">
            <label>Category</label> <br>
            <select  id="Category">
                <option value="Work">📁 Work</option>
                <option value="Learning">📚 Learning</option>
                <option value="Personal">👤 Personal</option>
                <option value="Shopping">🛒 Shopping</option>
            </select>
        </div>

        <div class="select-group">
            <label>Due Date</label> <br>
            <input type="date" id="DueDate" name="birthday">
        </div>

        <button id="btn">+ Add Task</button>
        
        
    </div>

       <!-- start total -->

    <div class="Boxes">
    
        <div class="start total">
   
            <i class="fa-solid fa-clipboard-list"></i>

            <div>
               <span class="value" id="Total">0</span>
               <span class="total">Total</span>
            </div>
   
        </div>

        <div class="start pending">
   
            <i class="fa-solid fa-hourglass-half"></i>

            <div>
               <span class="value" id="Pending">0</span>
               <span class="Pending">Pending</span>
            </div>
   
        </div>

        <div class="start completed">
   
            <i class="fa-solid fa-circle-check"></i>

            <div>
               <span class="value" id="Completed">0</span>
               <span class="Completed">Completed</span>
            </div>
   
        </div>


    </div>

    <!-- Search tasks -->


     <div class="search-tasks">
        
        <div class="search">
         <i class="fa-brands fa-sistrix"> </i>

        <input type="text" placeholder="Search tasks...." id="searchinput">
            
        </div>

        <div class="filters">

                <button class="filter active" data-filter="all">
                    All
                </button>

                <button class="filter" data-filter="active">
                    Active
                </button>

                <button class="filter" data-filter="completed">
                    Completed
                </button>

            </div>



    </div>
    <ul id="list"></ul>
  
</body>
<script src="taskflow.js"></script>
</html>
